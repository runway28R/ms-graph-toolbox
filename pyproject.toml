[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-graph-toolbox"
version = "0.1.0"
description = "A lightweight Python wrapper around Microsoft Graph for email, users, and SharePoint operations."
authors = [
    { name = "runway28R" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

dependencies = [
    "requests>=2.31.0",
    "msal>=1.27.0",
]

[project.urls]
Homepage = "https://github.com/runway28R/ms-graph-toolbox"
Source = "https://github.com/runway28R/ms-graph-toolbox"
Issues = "https://github.com/runway28R/ms-graph-toolbox/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ms_graph_toolbox*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
